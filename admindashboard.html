<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0A1E3F 50%, #A296E7 100%);
            color: #ffffff;
            min-height: 100vh;
        }
        
        .header {
    background: #261A4C;
    padding: 20px;
    border-bottom: 2.5px solid #FFD700;
    display: flex;
    flex-direction: column; /* stack title + user info */
    justify-content: center;
    align-items: center;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    text-align: center;
}

.admin-title {
    color: #FFD700;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    margin-bottom: 10px; /* space between title and user info */
}

.user-info {
    background: rgba(255, 255, 255, 0.1);
    padding: 8px 14px;
    border-radius: 15px;
    border: 1px solid #FFD700;
    color: #A296E7;
    font-size: 14px;
}
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        
        .back-btn {
            background: #EF4444;
            color: white;
            padding: 12px 24px;
            border: 1.5px solid #FFD700;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;

        .back-btn:hover {

        .logout-btn {

        .stats-container {
    display: grid;

.stat-card:hover {

}

.stat-card h3 {

.stat-number {

}


.admin-nav-buttons {

.section-toggle-btn.active,

    color: white;

}

        
        .requests-section {

            border-radius: 20px;

            backdrop-filter: blur(10px);

        }
        
        .section-title {
            color: #FFD700;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .request-card {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(162, 150, 231, 0.2);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .request-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            transition: left 0.6s;
        }
        
        .request-card:hover::before {
            left: 100%;
        }
        
        .request-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
            border-color: rgba(255, 215, 0, 0.5);
        }
        
        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .request-id {
            color: #A296E7;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            background: rgba(162, 150, 231, 0.1);
            padding: 5px 10px;

        .request-date {

        .request-status {

            border-radius: 25px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .status-pending {

            color: #FFA500;
            border: 2px solid #FFA500;
        }
        
        .status-completed {
            background: rgba(34, 197, 94, 0.2);
            color: #22C55E;
            border: 2px solid #22C55E;
        }
        
        .status-in-progress {
            background: rgba(59, 130, 246, 0.2);
            color: #3B82F6;
            border: 2px solid #3B82F6;
        }
        
        .request-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        
        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #FFD700;
        }
        
        .detail-label {
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .detail-value {
            color: white;
            font-size: 16px;
            word-break: break-word;
        }
        
        .request-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .update-btn {
            background: linear-gradient(135deg, #8B5CF6, #A855F7);
            color: white;
            border: 2px solid #FFD700;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
        }
        
        .update-btn:hover {
            background: linear-gradient(135deg, #7C3AED, #9333EA);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }
        
        .delete-btn {
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: white;
            border: 2px solid #FFD700;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3);
        }
        
        .delete-btn:hover {
            background: linear-gradient(135deg, #DC2626, #B91C1C);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
        }
        
        .no-requests {
            text-align: center;
            padding: 60px 20px;
            color: #A296E7;
            font-size: 18px;
            font-style: italic;
        }
        
        .filter-section {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-btn {
            background: rgba(139, 92, 246, 0.2);
            color: #A296E7;
            border: 2px solid #8B5CF6;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .filter-btn.active,
        .filter-btn:hover {
            background: #8B5CF6;
            color: white;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
    .stats-container {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 15px;
    }
        }

            .user-info {

            }

            }
        }

        async function loadDashboard() {
    console.log('Starting to load dashboard...');
    
    try {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';

        console.log('Attempting to fetch website requests...');
        
        // Try to get requests without ordering first (in case timestamp field doesn't exist)
        const requestsSnapshot = await db.collection('website-requests').get();
        
        console.log('Requests fetched successfully, count:', requestsSnapshot.size);
        
        allRequests = [];
        let total = 0, pending = 0, inProgress = 0, completed = 0;
        
        requestsSnapshot.forEach(doc => {
            const request = { id: doc.id, ...doc.data() };
            allRequests.push(request);
            total++;
            
            switch(request.status || 'pending') {
                case 'pending': pending++; break;
                case 'in-progress': inProgress++; break;
                case 'completed': completed++; break;
            }
        });
        
        // Sort requests by timestamp if it exists, newest first
        allRequests.sort((a, b) => {
            if (a.timestamp && b.timestamp) {
                return b.timestamp.seconds - a.timestamp.seconds;
            }
            return 0;
        });
        
        console.log('Updating stats...');
        document.getElementById('totalRequests').textContent = total;
        document.getElementById('pendingRequests').textContent = pending;
        document.getElementById('inProgressRequests').textContent = inProgress;
        document.getElementById('completedRequests').textContent = completed;
        
        console.log('Displaying requests...');
        displayRequests(allRequests);
        
        console.log('Dashboard loaded successfully');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
    } catch (error) {
        console.error('Error loading dashboard:', error);
        document.getElementById('loading').innerHTML = `
            <div style="color: #EF4444; text-align: center; padding: 40px;">
                <h3>Error loading dashboard</h3>
                <p>Error: ${error.message}</p>
                <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #8B5CF6; color: white; border: none; border-radius: 8px; cursor: pointer;">
                    Refresh Page
                </button>
            </div>
        `;
        
        // Show dashboard anyway with empty state
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('totalRequests').textContent = '0';
        document.getElementById('pendingRequests').textContent = '0';
        document.getElementById('inProgressRequests').textContent = '0';
        document.getElementById('completedRequests').textContent = '0';
        
        const requestsList = document.getElementById('requestsList');
        if (requestsList) {
            requestsList.innerHTML = '<div class="no-requests">No requests found or error loading data.</div>';
        }
    }
        }



// Section toggle functions
function showSection(sectionName) {
    // Hide all sections
    document.getElementById('containersSection').style.display = 'none';
    document.getElementById('requestsSection').style.display = 'none';
    
    // Remove active class from all buttons
    document.getElementById('requestsBtn').classList.remove('active');
    document.getElementById('containersBtn').classList.remove('active');
    
    // Show selected section and activate button
    if (sectionName === 'containers') {
        document.getElementById('containersSection').style.display = 'block';
        document.getElementById('containersBtn').classList.add('active');
        // Only load containers if user is authenticated
        if (currentUser && ADMIN_EMAILS.includes(currentUser.email)) {
            setTimeout(() => loadContainers(), 200);
        }
    } else {
        document.getElementById('requestsSection').style.display = 'block';
        document.getElementById('requestsBtn').classList.add('active');
    }
}

        function displayRequests(requests) {
    console.log('Displaying requests, count:', requests.length);
    const requestsList = document.getElementById('requestsList');
    
    if (!requestsList) {
        console.error('Requests list element not found');
        return;
    }
    
    if (requests.length === 0) {
        requestsList.innerHTML = '<div class="no-requests">No requests found.</div>';
        return;
    }
    
    requestsList.innerHTML = '';
    
    requests.forEach((request, index) => {
        try {
            console.log(`Creating card for request ${index + 1}`);
            const requestCard = createRequestCard(request);
            requestsList.appendChild(requestCard);
        } catch (error) {
            console.error('Error creating request card:', error, request);
        }
    });
    
    console.log('All request cards created successfully');
        }

        
        function createRequestCard(request) {
            const card = document.createElement('div');
            card.className = 'request-card';
            card.setAttribute('data-status', request.status || 'pending');
            
            const timestamp = request.timestamp 
                ? new Date(request.timestamp.seconds * 1000).toLocaleString()
                : 'No date';
            const status = request.status || 'pending';
            
            card.innerHTML = `
                <div class="request-header">
                    <div>
                        <div class="request-id">ID: ${request.id.substring(0, 8)}</div>
                        <div class="request-date">${timestamp}</div>
                    </div>
                    <div class="request-status status-${status}">${status.replace('-', ' ')}</div>
                </div>
                
                <div class="request-details">
                    <div class="detail-item">
                        <div class="detail-label">Full Name</div>
                        <div class="detail-value">${request.firstName} ${request.lastName}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Email Address</div>
                        <div class="detail-value">${request.email}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Phone Number</div>
                        <div class="detail-value">${request.phone}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Website Type</div>
                        <div class="detail-value">${request.websiteType}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Service Type</div>
                        <div class="detail-value">${request.selectedService || 'Direct Request'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Current Status</div>
                        <div class="detail-value">${status.replace('-', ' ').toUpperCase()}</div>
                    </div>
                </div>
                
                <div class="request-actions">
                    <button class="action-btn update-btn" onclick="updateRequestStatus('${request.id}', '${status}')">
                        Update Status
                    </button>
                    <button class="action-btn delete-btn" onclick="deleteRequest('${request.id}')">
                        Delete Request
                    </button>
                </div>
            `;
            
            return card;
        }

        async function updateRequestStatus(docId, currentStatus) {
            const statuses = ['pending', 'in-progress', 'completed'];
            const statusDisplayNames = ['Pending', 'In Progress', 'Completed'];
            
            let options = statuses.map((status, index) => 
                `${index + 1}. ${statusDisplayNames[index]}${status === currentStatus ? ' (current)' : ''}`
            ).join('\n');
            
            const selection = prompt(`Select new status:\n${options}\n\nEnter 1, 2, or 3:`);
            
            if (selection && ['1', '2', '3'].includes(selection)) {
                const newStatus = statuses[parseInt(selection) - 1];
                
                try {
                    await db.collection('website-requests').doc(docId).update({
                        status: newStatus,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    alert(`Status updated to: ${statusDisplayNames[parseInt(selection) - 1]}`);
                    loadDashboard();
                    
                } catch (error) {
                    console.error('Error updating status:', error);
                    alert('Error updating status. Please try again.');
                }
            }
        }

        async function deleteRequest(docId) {
            if (confirm('Are you sure you want to permanently delete this request? This action cannot be undone.')) {
                try {
                    await db.collection('website-requests').doc(docId).delete();
                    alert('Request deleted successfully.');
                    loadDashboard();
                    
                } catch (error) {
                    console.error('Error deleting request:', error);
                    alert('Error deleting request. Please try again.');
                }
            }
        }

        function filterRequests(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            let filteredRequests = allRequests;
            
            if (filter !== 'all') {
                filteredRequests = allRequests.filter(request => (request.status || 'pending') === filter);
            }
            
            displayRequests(filteredRequests);
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                auth.signOut().then(() => {
                    window.location.href = 'index.html';
                });
            }
        }

        // Auto-refresh dashboard every 30 seconds
        setInterval(() => {
            if (currentUser && ADMIN_EMAILS.includes(currentUser.email)) {
                loadDashboard();
            }
        }, 30000);

const containerForm = document.getElementById("containerForm");
const containerList = document.getElementById("containerList");

// === Container Management - FIXED VERSION ===
let editingContainerId = null;

// Handle container form submission
async function handleContainerSubmit(e) {
    e.preventDefault();
    
    const title = document.getElementById('title').value.trim();
    const text = document.getElementById('text').value.trim();
    const order = parseInt(document.getElementById('order').value);
    
    console.log('Form submitted with:', { title, text, order });
    
    if (!title || !text || !order) {
        alert('Please fill in all fields');
        return;
    }
    
    try {
        const containerData = {
            title: title,
            text: text,
            order: order,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        if (editingContainerId) {
            // Update existing container
            await db.collection('site-containers').doc(editingContainerId).update(containerData);
            alert('Container updated successfully!');
            editingContainerId = null;
            document.querySelector('#containerForm button[type="submit"]').textContent = 'Save Container';
        } else {
            // Create new container
            containerData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            await db.collection('site-containers').add(containerData);
            alert('Container created successfully!');
        }
        
        document.getElementById('containerForm').reset();
        loadContainers();
        
    } catch (error) {
        console.error('Error saving container:', error);
        alert('Error saving container: ' + error.message);
    }
}

// Load containers function
function loadContainers() {
    const containerList = document.getElementById("containerList");
    
    if (!containerList) {
        console.error("Container list element not found");
        return;
    }
    
    if (!currentUser || !ADMIN_EMAILS.includes(currentUser.email)) {
        containerList.innerHTML = "<div style='text-align: center; padding: 20px; color: #EF4444;'>Admin access required</div>";
        return;
    }
    
    containerList.innerHTML = "<div style='text-align: center; padding: 20px; color: #A296E7;'>Loading containers...</div>";
    
    db.collection("site-containers")
        .orderBy("order")
        .get()
        .then(snapshot => {
            console.log("Containers loaded successfully, count:", snapshot.size);
            containerList.innerHTML = "";
            
            if (snapshot.empty) {
                containerList.innerHTML = "<div style='text-align: center; padding: 40px; color: #A296E7; font-style: italic;'>No containers found. Create your first one!</div>";
                return;
            }
            
            snapshot.forEach(doc => {
                const data = doc.data();
                const containerDiv = document.createElement('div');
                containerDiv.className = 'request-card';
                containerDiv.innerHTML = `
                    <div class="request-header">
                        <div>
                            <h3 style="color: #FFD700; margin-bottom: 10px;">${data.title || 'Untitled'}</h3>
                            <div style="color: #A296E7; font-size: 14px;">Order: ${data.order || 'N/A'}</div>
                        </div>
                    </div>
                    <div style="margin: 20px 0;">
                        <p style="color: white; line-height: 1.6;">${data.text || 'No content'}</p>
                    </div>
                    <div class="request-actions">
                        <button class="action-btn update-btn" onclick="editContainer('${doc.id}')">Edit</button>
                        <button class="action-btn delete-btn" onclick="deleteContainer('${doc.id}')">Delete</button>
                    </div>
                `;
                containerList.appendChild(containerDiv);
            });
        })
        .catch(error => {
            console.error("Error loading containers:", error);
            containerList.innerHTML = `<div style='text-align: center; padding: 20px; color: #EF4444;'>Error: ${error.message}</div>`;
        });
}

// Delete container
async function deleteContainer(id) {
    if (confirm("Are you sure you want to delete this container?")) {
        try {
            await db.collection("site-containers").doc(id).delete();
            alert('Container deleted successfully!');
            loadContainers();
        } catch (error) {
            console.error('Error deleting container:', error);
            alert('Error deleting container: ' + error.message);
        }
    }
}

// Edit container
async function editContainer(id) {
    try {
        const docRef = await db.collection("site-containers").doc(id).get();
        
        if (!docRef.exists) {
            alert("Container not found!");
            return;
        }
        
        const data = docRef.data();
        
        document.getElementById("title").value = data.title || '';
        document.getElementById("text").value = data.text || '';
        document.getElementById("order").value = data.order || '';
        
        editingContainerId = id;
        document.querySelector('#containerForm button[type="submit"]').textContent = 'Update Container';
        
        document.getElementById('containerForm').scrollIntoView({ behavior: 'smooth' });
        
    } catch (error) {
        console.error("Error loading container for edit:", error);
        alert("Error loading container data: " + error.message);
    }
}

// Initialize form event listener when page loads
document.addEventListener('DOMContentLoaded', function() {
    const containerForm = document.getElementById('containerForm');
    if (containerForm) {
        containerForm.addEventListener('submit', handleContainerSubmit);
        console.log('Container form event listener attached');
    }
});

// Reset form back to add mode
async function defaultSubmit(e) {
  e.preventDefault();
  await db.collection("site-containers").add({
    title: document.getElementById("title").value,
    text: document.getElementById("text").value,
    buttonLabel: document.getElementById("buttonLabel").value,
    buttonLink: document.getElementById("buttonLink").value,
    order: parseInt(document.getElementById("order").value),
  });
  containerForm.reset();
  loadContainers();
}
